<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3D0B10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Srijonee Pujo Run</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--alta:#E5311F;--shada:#FFF8EC;--maroon:#3D0B10;--gold:#F6A91B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--maroon);font-family:'Baloo Da 2',system-ui,sans-serif;color:var(--shada);overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;display:none;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 0;pointer-events:none;font-weight:800;font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#hs{font-size:34px;line-height:1}#hp{color:var(--gold);font-size:18px}
#mu{pointer-events:auto;width:44px;height:44px;padding:0;font-size:20px;border-radius:50%;box-shadow:none;background:rgba(255,248,236,.2)}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:rgba(40,8,14,.74);text-align:center;overflow:auto}
.scr.on{display:flex}
h1{margin:0;font-size:52px;line-height:.9;font-weight:800;color:var(--shada);text-shadow:0 4px 0 var(--alta)}
h2{margin:0;font-size:34px;font-weight:800;color:var(--gold)}
p{margin:0;max-width:310px;line-height:1.25}
small{opacity:.75;max-width:290px}
.card{background:var(--shada);color:var(--maroon);border-radius:22px;padding:14px 18px;width:min(92vw,360px)}
.card img{height:132px;width:auto;display:block;margin:0 auto}
.big{font-size:64px;font-weight:800;line-height:1;color:var(--alta)}
#ob,#rk,#cm{font-weight:500}#cm{font-weight:800}
#chl{background:var(--gold);color:var(--maroon);padding:6px 14px;border-radius:14px;font-weight:800}
input{font:inherit;font-weight:800;font-size:20px;text-align:center;width:min(80vw,300px);padding:10px;border-radius:14px;border:3px solid var(--gold);background:var(--shada);color:var(--maroon);-webkit-user-select:text;user-select:text}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:800;font-size:19px;border:0;border-radius:16px;padding:10px 18px;background:var(--alta);color:#fff;width:min(80vw,300px);box-shadow:0 5px 0 #8f1a10}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #8f1a10}
button.alt{background:var(--shada);color:var(--maroon);box-shadow:0 5px 0 #c9b79a}
button.wa{background:#25D366;color:#073b1a;box-shadow:0 5px 0 #138a40}
ol{list-style:none;margin:0;padding:0;max-height:50vh;overflow:auto;text-align:left}
li{display:grid;grid-template-columns:40px 1fr auto;gap:6px;padding:7px 8px;border-radius:10px;font-weight:500;font-size:18px}
li:nth-child(odd){background:#f6ead3}li.me{background:var(--gold);font-weight:800}
li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li i{font-style:normal;font-weight:800}
#me{margin-top:8px;font-weight:800}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div><div id="hs">0</div><div id="hp"></div></div><div id="hf">🌼 0</div><button id="mu" aria-label="Sound">🔊</button></div>

<section class="scr on" id="sS">
 <div class="card"><img src="logo.jpg" alt="Srijonee"></div>
 <h1>Pujo Run</h1>
 <p>Run through the pandal. Collect shiuli. Dodge the Asur.</p>
 <p id="chl" hidden></p>
 <input id="nm" maxlength="16" placeholder="Your name" autocomplete="nickname">
 <button id="pl">Play</button>
 <button class="alt" id="lb1">Leaderboard</button>
 <small>Swipe left or right to change lane, up to jump, down to slide. On a keyboard use the arrow keys.</small>
</section>

<section class="scr" id="sO">
 <h2>The Asur got you!</h2>
 <div class="card"><div class="big" id="os">0</div><div>Score</div><div id="ob"></div><div id="rk"></div><div id="cm"></div></div>
 <button id="ag">Play again</button>
 <button class="wa" id="wa">Challenge a friend on WhatsApp</button>
 <button class="alt" id="lb2">Leaderboard</button>
</section>

<section class="scr" id="sL">
 <h2>Leaderboard</h2>
 <div class="card"><ol id="ls"></ol><div id="me"></div></div>
 <button class="alt" id="bk">Back</button>
</section>

<script>
const E=i=>document.getElementById(i),cv=E('c'),x=cv.getContext('2d');
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const S={name:ls.get('pr_name')||'',id:ls.get('pr_id')||(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()),best:+ls.get('pr_best')||0};
ls.set('pr_id',S.id);E('nm').value=S.name;
const q=new URLSearchParams(location.search),CH=q.get('c')&&+q.get('s')>0?{n:q.get('c').slice(0,16),s:Math.floor(+q.get('s'))}:null;
if(CH){E('chl').hidden=false;E('chl').textContent=CH.n+' scored '+CH.s+'. Can you beat it?'}

let W,H;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
const F=7,HZ=()=>H*.3,GY=()=>H*.8,U=()=>Math.min(W*.3,170);
const P=(l,z)=>{const s=F/(F+z);return{x:W/2+l*U()*s,y:HZ()+(GY()-HZ())*s,s}};
const hh=n=>{const v=Math.sin(n*12.9898)*43758.5453;return v-Math.floor(v)};
const SR=Array.from({length:40},(_,i)=>[hh(i+1),hh(i+50)*.7,i%3]);

/* audio */
let ac,mute=false;
function au(){if(!ac)try{ac=new(window.AudioContext||webkitAudioContext)()}catch(e){}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,ty,v,f2){if(!ac||mute)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}
E('mu').onclick=()=>{mute=!mute;E('mu').textContent=mute?'🔇':'🔊'};

/* state */
let st='idle',D=0,T=0,sc=0,fl=0,sp=14,lane=0,px=0,jy=0,vy=0,sl=0,ph=0,mult=1,pw=0,obs=[],cols=[],nx=0,tm=0,shake=0,bt=0,bi=0,prev='sS';
const PAT=[1,0,1,1,0,1,1,0];
const rnd=(a,b)=>a+Math.random()*(b-a);

function spawn(){
 const r=Math.random(),fr=[-1,0,1].sort(()=>Math.random()-.5),d=nx;
 if(r<.4){const n=Math.random()<.35?2:1;for(let i=0;i<n;i++)obs.push({t:'a',l:fr[i],d});for(let k=0;k<5;k++)cols.push({l:fr[2],d:d-3+k*1.4})}
 else if(r<.62){[-1,0,1].forEach(l=>obs.push({t:'b',l,d}));for(let k=0;k<3;k++)cols.push({l:0,d:d-1.4+k*1.4,h:1})}
 else if(r<.78){[-1,0,1].forEach(l=>obs.push({t:'n',l,d}))}
 else{const l=fr[0];for(let k=0;k<8;k++)cols.push({l,d:d+k*1.4});if(Math.random()<.4)obs.push({t:'p',l:fr[1],d:d+3})}
 nx+=rnd(11,15)-Math.min(D*.002,4);
}
function go(){au();const n=E('nm').value.trim();if(!n){E('nm').focus();return}
 S.name=n;ls.set('pr_name',n);D=0;sc=0;fl=0;sp=16;lane=px=0;jy=vy=sl=0;pw=0;mult=1;obs=[];cols=[];nx=32;tm=0;st='run';bi=0;
 show();E('hud').style.display='flex'}
function show(id){['sS','sO','sL'].forEach(s=>E(s).classList.toggle('on',s===id))}
function mv(d){lane=Math.max(-1,Math.min(1,lane+d));tone(300,.06,'triangle',.08,420)}
function act(k){if(k==='u'&&jy===0){vy=7.2;jy=.001;tone(260,.18,'square',.06,520)}
 if(k==='d'){sl=.6;if(jy>0)vy=-13;tone(200,.12,'triangle',.08,110)}}
function die(){st='over';shake=.4;if(navigator.vibrate)navigator.vibrate(180);tone(130,.45,'sawtooth',.22,40);
 const s=Math.floor(sc);E('hud').style.display='none';E('os').textContent=s;
 const nb=s>S.best;if(nb){S.best=s;ls.set('pr_best',s)}
 E('ob').textContent=nb?'New personal best!':'Your best is '+S.best;E('rk').textContent='Saving your score…';
 const cm=E('cm');cm.textContent=CH?(s>CH.s?'You beat '+CH.n+'!':CH.n+' leads by '+(CH.s-s)):'';
 setTimeout(()=>{if(st==='over')show('sO')},700);
 fetch('/api/score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:S.id,name:S.name,score:s,time:tm})})
 .then(r=>r.ok?r.json():Promise.reject()).then(d=>{E('rk').textContent=d.me?'You are #'+d.me.rank+' on the leaderboard':''}).catch(()=>{E('rk').textContent='Leaderboard is offline right now'})}

function collide(){
 for(const c of cols){if(c.g)continue;const z=c.d-D;if(z<.7&&z>-.7&&Math.abs(c.l-px)<.6&&(!c.h||jy>.3)){c.g=1;fl++;sc+=10*mult;tone(880,.1,'sine',.1,1320)}}
 for(const o of obs){const z=o.d-D;if(o.g||z>.4||z<-.5||Math.abs(o.l-px)>.55)continue;
  if(o.t==='p'){o.g=1;pw=6;mult=2;tone(180,.3,'triangle',.3,60);continue}
  if(o.t==='b'&&jy>.45)continue;if(o.t==='n'&&sl>0&&jy<.1)continue;die();return}
}
function upd(dt){
 T+=dt;if(shake>0)shake-=dt;
 if(st==='run'){
  tm+=dt;sp=Math.min(16+D*.011,38);D+=sp*dt;sc+=sp*dt*.5*mult;
  px+=(lane-px)*Math.min(1,dt*14);
  if(jy>0||vy>0){vy-=26*dt;jy+=vy*dt;if(jy<=0){jy=0;vy=0}}
  if(sl>0)sl-=dt;if(pw>0){pw-=dt;if(pw<=0)mult=1}
  while(nx<D+75)spawn();
  collide();
  obs=obs.filter(o=>o.d>D-4);cols=cols.filter(c=>c.d>D-4);
  bt-=dt;if(bt<=0){const a=PAT[bi++%8];tone(a?95:140,.14,'triangle',a?.28:.14,45);bt=.2-Math.min(sp-16,22)*.003}
  if(E('hs').textContent!=Math.floor(sc))E('hs').textContent=Math.floor(sc);
  E('hf').textContent='🌼 '+fl;E('hp').textContent=pw>0?'ঢাক ×2  '+Math.ceil(pw)+'s':'';
 }else if(st==='idle'){D+=12*dt;sp=12}
 ph+=st==='over'?0:dt*sp*.55;
}

/* drawing */
function quad(a,b,z0,z1,c){const p=P(a,z0),r=P(b,z0),s=P(b,z1),t=P(a,z1);x.fillStyle=c;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(r.x,r.y);x.lineTo(s.x,s.y);x.lineTo(t.x,t.y);x.fill()}
function pandal(){const c=W/2,b=HZ(),w=Math.min(W*.5,b*.95,260);
 let g=x.createRadialGradient(c,b-w*.3,4,c,b-w*.3,w*.95);g.addColorStop(0,'rgba(255,200,80,.6)');g.addColorStop(1,'rgba(255,200,80,0)');x.fillStyle=g;x.fillRect(0,0,W,b);
 for(let i=0;i<3;i++){const tw=w*(1-.28*i),th=w*.2,y=b-i*th*1.25;x.fillStyle='#2a0a16';x.fillRect(c-tw/2,y-th,tw,th);
  x.beginPath();x.moveTo(c-tw/2-6,y-th);x.lineTo(c,y-th-w*.14);x.lineTo(c+tw/2+6,y-th);x.fill();
  x.fillStyle='#f6a91b';for(let k=0;k<9;k++){x.beginPath();x.arc(c-tw/2+tw*(k+.5)/9,y-th*.45,1.7,0,7);x.fill()}}
 x.fillStyle='#f6a91b';x.beginPath();x.arc(c,b-w*.84-4,4,0,7);x.fill()}
function kaash(p){const k=U()*p.s;x.strokeStyle='#f4efe3';x.lineCap='round';x.lineWidth=Math.max(1,.05*k);
 for(let j=-2;j<=2;j++){x.beginPath();x.moveTo(p.x,p.y);x.quadraticCurveTo(p.x+j*.1*k,p.y-.4*k,p.x+j*.22*k+Math.sin(T*2+j)*.03*k,p.y-.85*k+Math.abs(j)*.12*k);x.stroke()}}
function flower(a,r,t){x.save();x.translate(a.x,a.y);x.rotate(t);x.fillStyle='#fff8ec';for(let k=0;k<5;k++){x.rotate(1.2566);x.beginPath();x.ellipse(0,-r*.7,r*.4,r*.75,0,0,7);x.fill()}x.fillStyle='#f6842a';x.beginPath();x.arc(0,0,r*.38,0,7);x.fill();x.restore()}
function asur(a,k){x.save();x.translate(a.x,a.y);
 x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(0,0,.42*k,.1*k,0,0,7);x.fill();
 x.fillStyle='#1d6b52';x.beginPath();x.moveTo(-.4*k,0);x.lineTo(-.32*k,-.95*k);x.lineTo(.32*k,-.95*k);x.lineTo(.4*k,0);x.fill();
 x.fillStyle='#e5311f';x.fillRect(-.38*k,-.4*k,.76*k,.2*k);
 x.fillStyle='#1d6b52';x.beginPath();x.arc(0,-1.15*k,.27*k,0,7);x.fill();
 x.fillStyle='#fff8ec';for(const s of[-1,1]){x.beginPath();x.moveTo(s*.2*k,-1.3*k);x.lineTo(s*.52*k,-1.72*k);x.lineTo(s*.08*k,-1.38*k);x.fill();x.beginPath();x.moveTo(s*.08*k,-.98*k);x.lineTo(s*.12*k,-.86*k);x.lineTo(s*.16*k,-.98*k);x.fill()}
 x.fillStyle='#ff3b2f';for(const s of[-1,1]){x.beginPath();x.arc(s*.1*k,-1.2*k,.045*k,0,7);x.fill()}
 x.fillStyle='#10201a';x.fillRect(-.12*k,-1.04*k,.24*k,.05*k);x.restore()}
function barrier(a,k){x.save();x.translate(a.x,a.y);x.fillStyle='#8a5a2b';x.fillRect(-.46*k,-.6*k,.07*k,.6*k);x.fillRect(.39*k,-.6*k,.07*k,.6*k);
 x.fillStyle='#e5311f';x.fillRect(-.46*k,-.55*k,.92*k,.15*k);x.fillStyle='#fff8ec';x.fillRect(-.46*k,-.32*k,.92*k,.15*k);x.restore()}
function banner(a,k){x.save();x.translate(a.x,a.y);x.fillStyle='#8a5a2b';x.fillRect(-.5*k,-2*k,.06*k,2*k);x.fillRect(.44*k,-2*k,.06*k,2*k);
 x.fillStyle='#f6a91b';x.fillRect(-.5*k,-1.95*k,k,1.2*k);x.strokeStyle='#e5311f';x.lineWidth=.07*k;x.strokeRect(-.46*k,-1.91*k,.92*k,1.12*k);
 if(a.s>.25){x.fillStyle='#8f1a10';x.font='800 '+.3*k+'px "Baloo Da 2",sans-serif';x.textAlign='center';x.fillText('শুভ পূজো',0,-1.25*k)}x.restore()}
function drum(a,k){const y=a.y-.6*k-Math.sin(T*4)*.06*k;x.save();x.translate(a.x,y);
 let g=x.createRadialGradient(0,0,2,0,0,.7*k);g.addColorStop(0,'rgba(255,210,90,.7)');g.addColorStop(1,'rgba(255,210,90,0)');x.fillStyle=g;x.fillRect(-.7*k,-.7*k,1.4*k,1.4*k);
 x.fillStyle='#b5651d';x.beginPath();x.ellipse(0,0,.3*k,.22*k,0,0,7);x.fill();x.fillStyle='#fff8ec';x.beginPath();x.ellipse(0,0,.22*k,.15*k,0,0,7);x.fill();
 x.strokeStyle='#e5311f';x.lineWidth=.04*k;x.beginPath();x.moveTo(-.28*k,-.06*k);x.lineTo(0,.2*k);x.lineTo(.28*k,-.06*k);x.stroke();
 x.strokeStyle='#f6a91b';x.lineWidth=.05*k;x.beginPath();x.moveTo(.1*k,-.35*k);x.lineTo(.35*k,-.1*k);x.moveTo(-.1*k,-.35*k);x.lineTo(-.35*k,-.1*k);x.stroke();x.restore()}
function ball(cx,cy,rx,ry,a,b,c){const g=x.createRadialGradient(cx-rx*.35,cy-ry*.4,Math.min(rx,ry)*.1,cx,cy,Math.max(rx,ry)*1.05);g.addColorStop(0,a);g.addColorStop(.55,b);g.addColorStop(1,c);x.fillStyle=g;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.fill()}
function limb(x1,y1,x2,y2,w,d,l){x.lineCap='round';x.strokeStyle=d;x.lineWidth=w;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.strokeStyle=l;x.lineWidth=w*.55;x.beginPath();x.moveTo(x1-w*.12,y1);x.lineTo(x2-w*.12,y2);x.stroke()}
const SK=['#ffd5ad','#e8a672','#b9693f'],HR=['#4d3d52','#1d1020','#07030a'],GD=['#fff2a8','#f6a91b','#a86a0a'],RD=['#ff7a5c','#e5311f','#8f1a10'];
function player(){
 const a=P(px,0),k=U(),s=Math.sin(ph),co=Math.cos(ph),run=jy===0&&sl<=0;
 x.save();x.translate(a.x,a.y);
 x.fillStyle='rgba(0,0,0,.4)';x.beginPath();x.ellipse(0,0,.35*k*(1-jy*.3),.09*k,0,0,7);x.fill();
 x.translate(0,-jy*k*1.1);
 if(pw>0){x.strokeStyle='rgba(246,169,27,'+(.5+.3*Math.sin(T*10))+')';x.lineWidth=.07*k;x.beginPath();x.arc(0,-.7*k,.85*k,0,7);x.stroke()}
 if(sl>0){x.translate(0,-.3*k);x.rotate(-1.35)}
 const sq=jy>0?1+Math.max(-.1,Math.min(.12,vy*.015)):1+Math.abs(s)*.03;x.scale(1/sq,sq);
 if(run)x.translate(0,-Math.abs(s)*.04*k);
 let turn=Math.max(-1,Math.min(1,(lane-px)*1.5));if(Math.abs(turn)<.1)turn=Math.min(1,Math.max(0,Math.sin(T*1.1)-.75)*4);
 const sg=turn<0?-1:1,sw=Math.sin(T*9)*.02*k,wv=Math.sin(T*8)*.06*k;
 for(const g of[1,-1]){const fx=g*.09*k+s*g*.2*k,fy=-.05*k-Math.max(0,co*g)*.16*k;limb(g*.09*k,-.5*k,fx,fy,.13*k,SK[2],SK[1]);ball(fx,fy,.1*k,.06*k,...GD)}
 /* saree skirt with red zari border and pleats */
 let gr=x.createLinearGradient(-.3*k,0,.3*k,0);gr.addColorStop(0,'#d6c9b2');gr.addColorStop(.45,'#fffaf0');gr.addColorStop(1,'#c9baa0');x.fillStyle=gr;
 x.beginPath();x.moveTo(-.2*k,-1*k);x.quadraticCurveTo(-.37*k,-.65*k,-.33*k+sw,-.3*k);x.lineTo(.33*k+sw,-.3*k);x.quadraticCurveTo(.37*k,-.65*k,.2*k,-1*k);x.fill();
 x.strokeStyle='rgba(120,100,70,.28)';x.lineWidth=.015*k;for(let i=-2;i<=2;i++){x.beginPath();x.moveTo(i*.06*k,-.9*k);x.quadraticCurveTo(i*.09*k,-.6*k,i*.1*k+sw,-.43*k);x.stroke()}
 x.fillStyle='#e5311f';x.beginPath();x.moveTo(-.345*k+sw*.8,-.43*k);x.lineTo(.345*k+sw*.8,-.43*k);x.lineTo(.33*k+sw,-.3*k);x.lineTo(-.33*k+sw,-.3*k);x.fill();
 x.fillStyle='#f6a91b';x.fillRect(-.34*k+sw*.8,-.41*k,.68*k,.025*k);
 /* blouse */
 ball(0,-.9*k,.21*k,.19*k,...RD);
 /* pallu streaming behind */
 gr=x.createLinearGradient(0,-k,.5*k,-.4*k);gr.addColorStop(0,'#fffaf0');gr.addColorStop(1,'#dccfb6');x.fillStyle=gr;
 x.beginPath();x.moveTo(.1*k,-.98*k);x.bezierCurveTo(.4*k,-1*k+wv,.55*k,-.75*k-wv,.64*k+wv,-.48*k);x.lineTo(.5*k+wv,-.44*k);x.bezierCurveTo(.42*k,-.65*k,.3*k,-.8*k,.05*k,-.8*k);x.fill();
 x.strokeStyle='#e5311f';x.lineWidth=.06*k;x.beginPath();x.moveTo(.64*k+wv,-.48*k);x.lineTo(.5*k+wv,-.44*k);x.stroke();
 /* arms with gold bangles */
